# App + Caddy (automatic HTTPS certificate). Put your domain in the Caddyfile, then:  docker compose up -d
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      TRUST_PROXY: "1"          # Caddy sits in front, so trust one proxy hop for the real client address
    volumes:
      - appdata:/data           # the database lives here; back this up
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
volumes:
  appdata:
  caddy_data:
  caddy_config:
