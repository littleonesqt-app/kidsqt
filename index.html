/* Layout: one-column touch app (max 520px), fixed bottom tab bar. Single warm light theme by design. */
:root{
  --bg:#F3F0EA; --card:#FFFFFF; --ink:#3A2620; --ink2:#4A3730; --muted:#75685F; --line:#E4DDD3;
  --brown:#4A2C25; --mustard:#F8C548; --orange:#E0743A; --sage:#DCE7C6; --sageD:#8DB061;
  --pink:#F6D6D1; --lav:#E1DBF8; --peach:#FBE3D2; --butter:#FBEBB8;
  --display:"Jua","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent}
*{scrollbar-width:none;-ms-overflow-style:none}
*::-webkit-scrollbar{display:none;width:0;height:0}
button{font-family:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,textarea:focus-visible{outline:3px solid var(--brown);outline-offset:2px}
.app{max-width:520px;margin:0 auto;min-height:100%;box-sizing:border-box;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(108px + env(safe-area-inset-bottom,0px))}
.app.nonav{padding-block:16px 32px}
.bleed{margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)))}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.disp{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;word-break:keep-all}
.h1{font-size:28px;line-height:1.2}
.h2{font-size:21px}
.meta{font-size:12px;color:var(--muted)}
.card{background:var(--card);border-radius:24px;padding:16px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:14px;font-size:12px;font-weight:700}
.icon-btn{width:44px;height:44px;flex-shrink:0;border:0;border-radius:22px;background:#FFFFFF;display:flex;align-items:center;justify-content:center}
.btn{height:56px;border:0;border-radius:28px;font-family:var(--display);font-size:20px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.dark{background:var(--brown);color:#FFFFFF}
.btn.orange{background:var(--orange);color:#FFFFFF}
.btn.off{background:var(--line);color:#5E514A;cursor:default}
.ghost{height:44px;border:0;background:transparent;color:var(--muted);font-size:14px;font-weight:500}
.nl{font-style:normal}
.ferr{display:flex;gap:8px;align-items:flex-start;padding:12px 14px;border-radius:18px;background:#FDE7D8;color:#9A4518;font-size:14px;font-weight:700;line-height:1.5;word-break:keep-all;animation:pop .35s ease-out}
.ferr svg{flex-shrink:0;margin-top:1px}
.mempage{word-break:keep-all}
.mtop{padding:14px;border-radius:24px;background:#E1DBF8;display:flex;flex-direction:column;gap:12px}
.mstars{display:inline-flex;gap:2px;align-items:center}
.mtabs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.mtab{height:54px;border:0;border-radius:18px;background:rgba(255,255,255,.7);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:13px;font-weight:700;color:#4F4290}

.mverse{display:flex;flex-wrap:wrap;gap:8px 6px;align-items:center;padding:16px 12px;border-radius:20px;background:#FBF8F3;min-height:60px;font-family:var(--display);font-size:21px;line-height:1.5;color:var(--ink)}

.mword{padding:2px 2px}
.mword.placed{color:#3F5A22}

.mline{min-height:120px;align-content:flex-start}

.mblk.shake{animation:mshake .45s ease}
@keyframes mshake{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(4px)}}
.mtile{min-width:46px;height:46px;padding:0 12px;border:0;border-radius:16px;background:#E1DBF8;font-family:var(--display);font-size:20px;color:#4F4290}

.mtile.rev{background:#FFFFFF;color:var(--ink);box-shadow:inset 0 0 0 2px #E1DBF8}
.mrecwrap{display:flex;flex-direction:column;align-items:center;gap:10px;padding:8px 0}

.mrec.on{background:#C9453A;box-shadow:0 0 0 0 rgba(201,69,58,.5);animation:mpulse 1.4s ease-out infinite}
.msq{width:30px;height:30px;border-radius:7px;background:#FFFFFF}

.mtime{font-size:28px;color:#C9453A}
.mlist{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:18px;background:#F5F2FD}
.mrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:16px;background:#FFFFFF}
.mqcard{padding:16px;border-radius:24px;background:#E1DBF8;display:flex;flex-direction:column;gap:12px;border:2px dashed #B7A8EE}
.vref{display:inline-flex;align-items:center;gap:3px;padding:0 2px;border:0;background:none;color:inherit;font:inherit;font-weight:700;text-decoration:underline;text-decoration-style:dotted;text-decoration-thickness:2px;text-underline-offset:3px;cursor:pointer;border-radius:6px}
.vref:hover,.vref:focus-visible{background:rgba(255,255,255,.7)}
.dialog.vdlg{align-items:stretch;text-align:left;max-height:calc(100vh - 48px);max-height:calc(100dvh - 48px);gap:10px;padding:22px 20px 16px}
.vdlg .chip{align-self:flex-start}
.vclose{position:absolute;right:14px;top:14px;background:#F3F0EA}
.vbody{word-break:keep-all;overflow-y:auto;overscroll-behavior:contain;min-height:0;flex:1;display:flex;flex-direction:column;gap:14px;padding:14px 14px 14px 10px;border-radius:20px;background:#FBF8F3}
.vbody .vt{font-size:18px;line-height:1.7}

.note{position:relative}
.nstk{position:absolute;right:8px;top:-8px;display:flex;pointer-events:none;filter:drop-shadow(0 2px 3px rgba(74,44,37,.18))}

.tile span{word-break:keep-all}

.nav div{max-width:520px;margin:0 auto;height:80px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr))}

.dc-day{font-size:12px;font-weight:700}
.dc-circle{position:relative;width:42px;height:42px;border-radius:21px;background:#FFFFFF;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;color:#3A2620}
.dc-circle.today{background:#F8C548}
.dc-circle.done{background:transparent}
.dc-title{font-family:var(--display);font-size:13px;line-height:1.2;text-align:center;color:#3A2620;word-break:keep-all}
.versecard{width:100%;padding:0;border:0;border-radius:28px;background:#FFFFFF;overflow:hidden;display:flex;flex-direction:column;text-align:left}

.memcard{position:relative;margin-top:8px;padding:18px;border-radius:26px;background:#E1DBF8}

.pbg-art{position:absolute;left:50%;top:calc(52px + env(safe-area-inset-top,0px));transform:translateX(-50%)}

var PG_EN={
 week:{chip:'This Week at a Glance',title:"Let's Know Who Jesus Really Is!",sub:'Colossians — Who Is Jesus?',period:'Oct 19–25, 2026 · Devotional Guide for Parents',ref:'Colossians 1:13–20',desc:"This week's main message and theme",
  refs:[['Passage','Colossians 1:13–20'],['Further reading','Colossians 1–4'],['Memory verse','Colossians 1:15']],
  parts:[
   ['Why is it important to know Jesus rightly?',[
    'This week we reflect together on the letter Paul sent to the church in Colossae.',
    'The church in Colossae is believed to have begun when people heard the gospel through Epaphras. The believers trusted in Jesus, loved one another, and were growing in the gospel. But false teachings that shook their faith were also spreading in the church. Some people taught that, besides believing in Jesus, they also needed to keep special rules or rely on other spiritual beings.',
    'When Paul heard this news, he wrote a letter to the believers in Colossae. But Paul does not start by arguing against the false teaching. First, he clearly teaches who Jesus Christ is.',
    'Jesus is the image of the invisible God and the One who created all things. He existed before all things, and even now He holds all things together. He is also the head of the church, and through the cross He made peace between God and us.']],
   ['Why did Paul explain so much about Jesus?',[
    'Because he wanted the believers to know Jesus rightly and stand firm in Him. When we truly know who Jesus is, we can recognize false teaching. And above everything else, we can have faith that relies on Jesus.',
    'What children need to learn this week is not a list of facts about Jesus. What matters is helping them discover what knowing who Jesus is means for our faith and our lives.',
    'If Jesus is the head of the church, we should live by His Word. If Jesus saved us from sin and made peace between us and God, we should remember that love and live lives that love and forgive others.']]],
  three:['Jesus is the Son of God who saves us and who created all things.','When we know Jesus rightly, we can recognize false teaching and stand firm in faith.','People who believe in Jesus live by following His love.'],
  verse:['Colossians 1:15','He is the image of the invisible God, the firstborn of all creation.']},
 mon:{day:'Monday',name:'Open Hearts',title:'Who Is Jesus?',
  focus:'Discovering the reasons for both hardship and joy in the same scene',
  body:["On Monday, children look closely at the picture and think about Paul's situation. First, help them find things like the chains on Paul's hands, the soldier guarding him, and the window with bars. The goal is for them to understand that Paul could not go wherever he wanted, and to imagine how he might have felt.",
   'Next, have them look at the same picture again. Paul is writing a letter, and people who are listening to God’s Word have gathered around him. Even in a hard situation, Paul could still meet people and share the gospel.',
   'What matters here is not that the picture changed, but that the part the children are looking at changed.',
   'It is not wrong if children notice the hard parts first. Let them fully feel and understand the difficulty, and then guide them to look for what else is in the same situation.',
   "For the third question, encourage them to share their own ideas about what Paul was looking at that kept him from losing his joy. It's okay if they don't know the exact answer yet. Starting Tuesday, they will read the Bible and discover the reasons one by one."]},
 tue:{day:'Tuesday',name:'Find the Word',sub:'Finding Facts in the Word',title:'Find What the Bible Says',
  focus:'Confirming from the Bible the real reasons Paul was thankful and joyful',
  body:['On Tuesday, children connect what they imagined from the picture with the facts written in the Bible.',
   'In Philippians 1:3–5, Paul says that every time he remembers the believers in Philippi, he thanks God and prays with joy. Help children discover that Paul was not happy just because of good memories; he was thankful because the Philippian church had been part of the work of the gospel from the very beginning.',
   'Next, in verses 12–14, look at what happened after Paul was imprisoned. Many people, including the Roman soldiers, came to know that Paul was in prison for Christ, and other believers became even bolder in sharing God’s Word.',
   'Especially in the O/X question (No. 3) and the written question (No. 4), point out that Paul being in prison did not stop the gospel from being shared.',
   'When children look for answers in the Bible, read the verse to them again and wait for them to find the words that give the answer on their own.',
   'Paul was in prison, but the gospel kept on spreading. This is the important truth children should discover on Tuesday.']},
 wed:{day:'Wednesday',name:'Hidden Story',sub:'Discovering the Hidden Heart',title:'Why Did He Do That?',
  focus:'Discovering what Paul valued most',
  body:["On Wednesday, children look a little more deeply at Paul's heart through his words and actions in the Bible.",
   'Even though Paul was in prison, he cared more about the gospel being shared than about what was happening to him. Even though his situation did not get better, he rejoiced that more people were coming to know Jesus and that other believers were bravely sharing God’s Word.',
   "If children chose 'joyful' or 'thankful' to describe Paul's heart in the first question, take one more step and talk together about why he might have felt that way.",
   'Especially in the second and third questions, help them think separately about what Paul wanted and what made him rejoice.',
   "There is no need to explain that Paul didn't want freedom or that things weren't hard for him. Paul may have wanted to be free and comfortable too. But his letter shows a heart that rejoiced more in the gospel being shared than in his own comfort.",
   'In the last question, children choose the sentence that best describes Paul’s heart. Ask them to share briefly why they chose that sentence.',
   "This Wednesday, we hope children discover through Paul's heart that 'what I value most can change the reason for my joy.'"]},
 thu:{day:'Thursday',name:"God's Heart",sub:"Discovering God's Heart",title:"Getting to Know God's Heart!",
  focus:'Discovering God, who keeps working even in hard times',
  body:["On Thursday, we turn our attention from Paul's heart to what God was doing.",
   'Paul could no longer travel freely to different places to share the gospel as he had before. But God caused the gospel to be shared even in that situation. The Roman soldiers learned why Paul was in prison, and other believers boldly shared God’s Word.',
   "In the second matching activity, help children see specifically what Paul's imprisonment led to. Instead of looking only at what Paul could not do, it is important for them to discover what God was doing even in that situation.",
   "Also, in Philippians 1:6, Paul is confident that God, who began a good work among the believers in Philippi, will carry it on to completion. Paul's joy came from his faith that God is faithful.",
   'However, please be careful not to tell children that God will always turn every hardship into a good outcome. Even when we believe in God, hard situations can continue.',
   'What we are learning is that God does not abandon us in hard times, and that He keeps carrying out His good work.',
   "If children can say in one sentence who God is, they have reached the main goal of Thursday's devotion."]},
 fri:{day:'Friday',name:'Into My Life',sub:'Applying the Word to Life',title:'How Should I Live?',
  focus:'Looking at the same situation again and finding chances to show love',
  body:['On Friday, children connect what they saw in Paul this week with their own daily lives.',
   'In the first activity, they look at situations like not being able to play because a friend is sick, or having to stop doing something they want because Mom asked for help. Both are situations that can really upset children.',
   'But when they look at the same situation again, they discover that they can pray for their friend and send kind words, or show love by helping Mom.',
   'The point of this question is not to make children think that upsetting things are good. Instead, emphasize that even in an upsetting situation, there is something good they can do.',
   'In the second question, children think about telling a friend about their faith. Explaining to a friend why they believe in Jesus can feel embarrassing or hard. But encourage them to remember Paul and think of ways to share their faith with a little courage.',
   'In the third question, children look back on something that actually upset them or was hard for them this week. When your child shares a hard experience, first listen fully to their feelings. Then think together about whether there was something to be thankful for in that situation, or someone who helped them.',
   "It's okay if they can't find something to be thankful for right away. Not every hardship has to have a good side.",
   'This Friday, we hope children will move beyond looking only at hard situations and finish the week by discovering small chances to trust God and show love, even in the middle of them.']}
};

/* Shared back button: views place an invisible placeholder; the real button is drawn once, fixed to the viewport */
function backBtn(a,v,label,st){return '<span class="backph" aria-hidden="true" data-ba="'+a+'" data-bv="'+(v||'')+'" data-bl="'+label+'"'+(st?' style="'+st+'"':'')+'></span>';}
function placeBack(){
 var host=document.getElementById('backfix'),app=document.getElementById('app');
 if(!host){host=document.createElement('div');host.id='backfix';document.body.insertBefore(host,app);}
 var ph=app.querySelector('.backph');
 if(!ph){host.innerHTML='';return;}
 var a=ph.getAttribute('data-ba'),v=ph.getAttribute('data-bv'),l=ph.getAttribute('data-bl');
 var b=host.firstChild;
 if(!b||b.getAttribute('data-a')!==a||(b.getAttribute('data-v')||'')!==v){host.innerHTML='<button class="icon-btn backbtn" type="button" data-a="'+a+'"'+(v?' data-v="'+v+'"':'')+' aria-label="'+l+'">'+back()+'</button>';b=host.firstChild;}
 else b.setAttribute('aria-label',l);
 var r=ph.getBoundingClientRect();
 b.style.left=Math.round(r.left)+'px';
 b.style.top='max('+Math.round(r.top+window.scrollY)+'px, calc(env(safe-area-inset-top, 0px) + 8px))';
}
window.addEventListener('resize',function(){placeBack();});

 week:{chip:'이번 주 말씀 한눈에 보기',title:'사랑받는 형제',sub:'빌레몬서 — 복음은 사람을 새롭게 하고 관계를 변화시킵니다',period:'2026.10.26–11.1 · 부모님을 위한 묵상 가이드',ref:'빌레몬서 1:10-18',color:'#FBEBB8',ink:'#6E5410',desc:'한 주의 핵심 메시지와 주제',
  refs:[['본문','빌레몬서 1:10–18'],['참고 말씀','빌레몬서 1장'],['암송 말씀','빌레몬서 1:16상']],
  parts:[
   ['복음은 사람을 새롭게 하고 관계를 변화시킵니다',[
    '빌레몬서는 사도 바울이 빌레몬에게 보낸 짧고 개인적인 편지입니다. 그러나 그 안에는 예수 그리스도의 복음이 한 사람의 정체성과 사람들 사이의 관계를 어떻게 변화시키는지에 관한 깊은 신학적 메시지가 담겨 있습니다.',
    '빌레몬은 골로새 지역의 그리스도인으로, 그의 집에는 교회가 모이고 있었습니다(몬 1:2). 오네시모는 빌레몬에게 속한 종이었지만, 어떤 이유로 그를 떠나 바울과 만나게 되었습니다. 성경은 오네시모가 빌레몬에게 불의를 행했거나 빚을 졌을 가능성을 언급하지만(18절), 구체적으로 무슨 일이 있었는지는 알려 주지 않습니다.',
    '바울과 만난 오네시모는 복음을 받아들였고, 바울은 그를 자신의 아들이자 심복이라고 부를 만큼 소중히 여기게 되었습니다. 이제 바울은 오네시모를 빌레몬에게 돌려보내면서 특별한 요청을 합니다. 그를 이전처럼 종으로만 대하지 말고, 그리스도 안에서 사랑받는 형제로 받아 달라는 것입니다.',
    '당시 로마 사회에서 주인과 종의 관계는 분명한 신분적 차이를 바탕으로 형성되어 있었습니다. 그러나 바울은 이 관계 안에 복음이 가져온 새로운 기준을 제시합니다. 오네시모는 여전히 같은 사람이지만, 그리스도 안에서 그를 바라보는 시선과 대하는 방식은 달라져야 한다는 것입니다.',
    '이것이 이번 주 묵상의 중심입니다.',
    '<b>예수 그리스도의 복음은 우리에게 새로운 정체성을 주며, 다른 사람을 바라보고 대하는 태도까지 변화시킵니다.</b>']],
   ['성경의 큰 이야기 속에서 빌레몬서 바라보기',[
    '이번 주에는 빌레몬서의 작은 이야기를 성경 전체에 나타난 하나님의 구원 이야기와 연결하여 살펴보고자 합니다.',
    '하나님은 모든 사람을 자신의 형상대로 창조하셨습니다(창 1:27). 그러나 죄는 하나님과 인간의 관계뿐 아니라 사람과 사람 사이에도 갈등과 분열을 가져왔습니다. 예수 그리스도는 십자가를 통해 하나님과 우리를 화목하게 하셨으며, 그리스도 안에서 서로 다른 사람들이 하나님의 백성으로 함께 살아가는 새로운 공동체를 이루게 하셨습니다(엡 2:14–16).',
    '이러한 복음의 의미가 빌레몬서에 구체적으로 드러납니다.',
    '바울은 오네시모를 사랑받는 형제로 받아 달라고 요청했고, 그에게 빚이 있다면 자신이 책임지겠다고 말합니다. 이는 그리스도 안에서 이루어지는 화목이 단순히 마음속의 생각으로 끝나지 않고 실제적인 관계와 행동에 영향을 주어야 한다는 사실을 보여 줍니다.',
    '다만 바울이 오네시모의 빚을 책임지겠다고 한 행동과 예수 그리스도의 십자가 구속을 동일하게 해석해서는 안 됩니다. 바울의 행동은 우리를 위해 자신을 내어주신 그리스도의 사랑을 떠올리게 하는 실천적 모습으로 이해할 수 있습니다.']]],
  threeTitle:'부모님이 기억해야 할 세 가지 신학적 관점',

  closing:{title:'한 주간 묵상을 마무리하며',body:[
    '이번 주 아이들은 바울이 빌레몬에게 보낸 짧은 편지를 읽으며 한 사람을 바라보는 시선이 복음 안에서 어떻게 달라지는지 묵상했습니다.',
    '오네시모는 빌레몬에게 종이었지만, 바울은 그를 사랑받는 형제로 받아 달라고 요청했습니다. 바울이 전한 복음은 단순히 새로운 지식을 배우게 하는 소식이 아니었습니다. 사람의 정체성을 새롭게 하고, 서로의 관계를 변화시키며, 사랑을 구체적인 행동으로 나타나게 하는 능력이었습니다.',
    '부모님께서도 이번 주 묵상을 마무리하면서 아이들과 함께 다음 질문을 나누어 보시면 좋겠습니다.'],
   ask:'“예수님이 나를 사랑하신다는 사실을 기억할 때, 다른 사람을 바라보는 내 마음은 어떻게 달라질 수 있을까?”',
   after:['아이가 자신의 말로 답할 수 있도록 충분히 기다려 주세요. 짧은 대답이라도 그 안에서 복음과 자신의 삶을 연결하려는 생각을 발견한다면, 그것이 이번 묵상의 중요한 열매가 될 것입니다.'],
   keyTitle:'이번 주의 핵심 메시지',
   key:'예수님은 우리를 사랑하시고 새롭게 하십니다. 그리고 그 사랑을 받은 우리가 다른 사람도 소중히 여기며 사랑하도록 이끌어 주십니다.',
   end:'작은 편지에 담긴 이 이야기를 통해 아이들이 하나님의 크고 놀라운 구원 이야기를 조금씩 알아 가기를 소망합니다.'}},
 mon:{day:'월요일',name:'마음 열기',sub:'말씀을 느껴요!',title:'바울이 보낸 특별한 편지',color:'#F6D6D1',ink:'#7A3A35',
  focus:'당시의 상황을 상상하며 성경 속 세계로 들어가기',
  body:['월요일에는 바울이 편지를 쓰는 모습과 오네시모가 처한 상황을 상상합니다. 아이들이 성경의 사건을 자신의 삶과 연결하기 전에, 먼저 그 이야기가 일어났던 시대와 사람들의 상황에 관심을 갖도록 도와주세요.',
   '당시 로마 사회의 종은 오늘날의 직원이나 가사도우미와는 달랐습니다. 종은 자유와 권리에 심각한 제약을 받았으며, 주인과 동등한 사회적 지위를 누리지 못했습니다. 이러한 배경을 간단하게 설명하면 바울이 오네시모를 ‘사랑받는 형제’로 받아 달라고 요청한 일이 얼마나 특별한 의미를 갖는지 이해하는 데 도움이 됩니다.',
   '1번에서 바울의 모습을 그릴 때는 감옥이나 갇혀 있는 상황을 함께 상상할 수 있도록 안내해 주세요. 바울은 자유롭지 못한 상황에 있었지만 다른 사람을 위해 편지를 쓰고 있었습니다.',
   '2번과 3번에서는 오네시모의 감정과 말을 상상합니다. 그러나 성경은 오네시모가 빌레몬에게 돌아가면서 어떤 마음이었는지, 무슨 말을 했는지 직접 알려 주지 않습니다. 아이가 두려움이나 걱정을 선택할 수도 있고, 빌레몬이 자신을 받아 줄 것이라는 기대를 표현할 수도 있습니다. 어느 하나를 정답으로 정하기보다 자신의 상상과 성경의 기록을 구별하도록 도와주세요.',
   '4번에서는 바울이 편지를 통해 어떤 결과를 기대했을지 생각합니다. 이때 빌레몬이 실제로 어떻게 반응했는지 성경이 알려 주지 않는다는 점을 기억해 주세요.'],
  insight:['성경 해석은 오늘날 우리의 생각을 본문에 곧바로 적용하는 것에서 시작하지 않습니다. 먼저 성경이 기록된 시대와 상황을 이해하려는 노력이 필요합니다. 아이들이 당시의 세계를 상상하는 것은 단순한 그림 활동이 아니라 성경의 역사적 배경을 이해하는 첫걸음입니다.']},
 tue:{day:'화요일',name:'말씀 찾기',sub:'말씀을 살펴요!',title:'바울은 무엇을 부탁했을까요?',color:'#E1DBF8',ink:'#4F4290',
  focus:'성경이 실제로 말하는 내용을 정확하게 발견하기',
  body:['화요일에는 본문을 자세히 읽으며 바울이 오네시모를 어떻게 소개하고, 빌레몬에게 무엇을 요청했는지 찾아봅니다.',
   '1번에서 바울은 오네시모를 자신의 ‘아들’이라고 부릅니다. 이는 오네시모가 바울의 친아들이라는 뜻이 아니라, 바울이 갇혀 있는 동안 오네시모가 복음을 받아들이게 된 영적인 관계를 나타냅니다. 아이들이 이 표현을 통해 바울과 오네시모가 얼마나 가까운 관계가 되었는지 이해하도록 안내해 주세요.',
   '2번에서는 바울이 오네시모를 이전에는 ‘무익한’ 사람이었지만 이제는 ‘유익한’ 사람이라고 표현한 점을 살펴봅니다. 오네시모라는 이름 자체가 ‘유익한’이라는 의미와 관련되어 있어, 바울은 이름의 뜻을 활용하여 그의 달라진 모습을 강조합니다.',
   '여기서 중요한 것은 오네시모가 이제 바울에게 도움이 되는 사람이 되었기 때문에 가치 있는 존재가 되었다는 뜻으로 해석하지 않는 것입니다. 사람의 가치는 유용성으로 결정되지 않습니다. 바울은 복음을 통해 오네시모에게 일어난 변화를 설명하고 있는 것입니다.',
   '3번은 이번 주 전체를 이끄는 핵심 구절입니다. 바울은 오네시모를 ‘사랑받는 형제’로 받아 달라고 요청합니다. 이 말은 단순히 친절하게 대하라는 부탁보다 깊은 의미를 갖습니다. 그리스도 안에서 두 사람이 새로운 관계를 맺게 되었다는 선언이기 때문입니다.',
   '4번에서는 바울이 오네시모의 잘못이나 빚을 자신의 책임으로 돌리라고 요청한 내용을 확인합니다. 이때 18절의 ‘만일’이라는 조건에 주목해 주세요. 성경은 오네시모가 실제로 얼마를 빚졌는지, 어떤 잘못을 저질렀는지 구체적으로 밝히지 않습니다.'],
  insight:['성경을 바르게 이해하기 위해서는 본문이 명확하게 말하는 것과 우리가 추측하는 것을 구별해야 합니다. 아이들에게 성경에서 답을 직접 찾아보게 하는 것은 단순한 성경 지식 확인이 아니라 말씀에 근거하여 생각하는 습관을 기르는 훈련입니다.']},
 wed:{day:'수요일',name:'숨은 이야기',sub:'숨은 마음을 발견해요!',title:'바울의 부탁에 담긴 마음',color:'#DCE7C6',ink:'#44572A',
  focus:'바울의 말과 행동 속에 담긴 의도를 발견하기',
  body:['수요일에는 바울이 무엇을 말했는지를 넘어 왜 그렇게 말했는지를 생각합니다.',
   '1번에서는 바울이 명령할 수도 있었지만 사랑으로 부탁했다는 사실에 주목합니다(8–9절). 바울에게는 사도로서 권위를 가지고 요청할 수 있는 위치가 있었지만, 그는 빌레몬에게 사랑에 근거한 결정을 요청합니다.',
   '3번의 내용도 이와 연결됩니다. 바울은 빌레몬이 억지로 선한 일을 행하기보다 자발적인 마음으로 선택하기를 원했습니다(14절). 이는 기독교 윤리에서 중요한 의미를 갖습니다. 선한 행동은 외적인 행위뿐 아니라 그 행동을 선택하는 마음과 동기도 함께 살펴야 하기 때문입니다.',
   '2번에서 바울은 오네시모를 자신의 ‘심복’이라고 부릅니다. 원문에서 이 표현은 내장이나 마음을 가리키는 단어로, 매우 깊은 애정을 나타냅니다. 오네시모는 바울에게 단순히 도움을 주는 사람이 아니라 마음을 나누는 소중한 사람이 되었습니다.',
   '4번에서는 바울이 빌레몬에게 오네시모를 자기 자신을 맞이하듯 받아 달라고 한 요청을 묵상합니다(17절). 바울은 자신의 관계와 신뢰를 활용하여 오네시모가 받아들여질 수 있도록 돕고 있습니다.',
   '부모님은 아이들과 함께 누군가를 사랑한다는 말이 실제로 어떤 태도와 행동으로 나타날 수 있는지 생각해 보세요. 그러나 수요일에는 아직 아이들에게 특정 행동을 실천하라고 요구하기보다, 바울의 마음을 충분히 발견하도록 안내하는 것이 좋습니다.'],
  insight:['바울의 요청에는 사랑과 자발성이라는 중요한 가치가 담겨 있습니다. 그는 자신의 권위로 상대방의 행동을 강제하기보다, 복음을 받은 사람이 사랑으로 응답하기를 기대했습니다. 이 모습은 부모가 자녀의 신앙을 지도할 때에도 의미가 있습니다. 믿음의 행동을 단순히 요구하는 것에서 나아가, 아이가 왜 그렇게 살아야 하는지 스스로 이해하고 선택하도록 돕는 것이 중요합니다.']},
 thu:{day:'목요일',name:'하나님 마음',sub:'하나님의 마음을 알아요!',title:'예수님 안에서 새로워지는 관계',color:'#FBE3D2',ink:'#8A4A22',
  focus:'빌레몬서의 이야기를 예수 그리스도의 복음과 연결하기',
  body:['목요일에는 바울과 오네시모, 빌레몬의 이야기를 성경 전체의 구원 이야기 속에서 바라봅니다.',
   '1번에서는 빌레몬서 1:16을 통해 바울이 오네시모를 ‘종’이 아니라 <b>‘사랑받는 형제’</b>로 받아들이라고 요청한 의미를 살펴봅니다.',
   '당시 로마 사회에서 종과 주인은 사회적 신분과 권리에 큰 차이가 있었습니다. 그러나 바울은 오네시모가 그리스도 안에서 새롭게 된 사람이므로, 빌레몬도 그를 이전의 신분으로만 바라보아서는 안 된다고 강조합니다.',
   '이는 복음이 단순히 개인의 내면을 변화시키는 데 그치지 않고, 사람과 사람 사이의 관계를 새롭게 한다는 사실을 보여 줍니다.',
   '아이들에게 ‘사랑받는 형제’라는 표현은 단순히 친하게 지내라는 뜻이 아니라, 예수님 안에서 서로를 소중한 하나님의 가족으로 받아들이라는 의미임을 설명해 주세요.',
   '2번에서는 갈라디아서 3:28을 읽으며 그리스도 안에서 서로 다른 사람들이 하나라는 사실을 발견합니다. 당시 사회에서는 출신과 신분, 성별에 따라 사람을 구분했습니다. 그러나 그리스도 안에서는 이러한 차이가 하나님의 백성으로서 서로를 받아들이는 데 장벽이 되어서는 안 됩니다.',
   '3번에서는 바울이 오네시모의 빚을 자신에게 계산하라고 한 행동과 우리의 죄를 위해 죽으신 예수님의 사랑을 비교합니다. 바울은 다른 사람의 부담을 자신이 감당하겠다고 했고, 예수님은 우리를 위해 십자가에서 자신을 내어주셨습니다.',
   '여기서 바울의 행동은 예수님의 구속 사역과 동일하지 않지만, 그리스도의 사랑을 닮아 가는 삶이 어떤 모습인지 보여 줍니다. 복음은 우리가 하나님께 받은 사랑을 다른 사람과의 관계 속에서 실천하도록 이끕니다.',
   '4번에서는 빌레몬과 오네시모가 그리스도 안에서 서로를 어떻게 대해야 하는지 생각합니다. 아이들이 ‘사랑해야 해요’, ‘존중해야 해요’, ‘형제로 받아들여야 해요’와 같은 표현으로 답한다면, 그 이유가 두 사람 모두 그리스도 안에 속한 사람이기 때문이라는 점을 함께 살펴주세요.'],
  insight:['빌레몬서는 복음이 개인의 내면에만 머무르지 않고 인간관계에 새로운 질서를 가져온다는 사실을 보여 줍니다. 주인과 종이라는 기존의 사회적 관계를 넘어, 바울은 그리스도 안에서 서로를 사랑받는 형제로 대하도록 요청합니다. 이것이 그리스도 안에서 이루어지는 새로운 공동체의 모습입니다.',
   '특히 부모님은 아이들이 이 이야기를 단순히 ‘착하게 살아야 한다’는 교훈으로 받아들이지 않도록 도와주세요. 우리가 사랑해야 하는 근거는 예수님께서 먼저 우리를 사랑하셨다는 복음에 있습니다.']},
 fri:{day:'금요일',name:'내 삶으로',sub:'말씀대로 살아가요!',title:'예수님의 사랑을 삶으로',color:'#D6ECF5',ink:'#2F5A72',
  focus:'복음으로 다른 사람을 바라보고 사랑을 실천하기',
  body:['금요일에는 한 주간 발견한 말씀을 일상적인 관계 속으로 가져옵니다.',
   '1번에서는 과거에 잘못한 친구를 계속 나쁜 아이라고 부르는 상황을 제시합니다. 아이들이 친구의 잘못을 무조건 괜찮다고 생각하도록 하는 것이 아니라, 한 사람의 가치를 그가 저지른 잘못으로만 판단해서는 안 된다는 사실을 배우도록 안내해 주세요.',
   '이는 바울이 오네시모를 과거의 신분이나 잘못으로만 바라보지 않고 그리스도 안에서 사랑받는 형제로 받아들였던 태도와 연결됩니다.',
   '2번에서는 다툰 친구와 관계를 회복하기 위해 필요한 말을 찾아봅니다. ‘미안해’, ‘네 말을 들어볼게’, ‘다시 잘 지내고 싶어’라는 말은 각각 자신의 잘못을 인정하고 상대방을 이해하며 화해를 향해 나아가는 태도를 보여 줍니다.',
   '이때 모든 갈등이 반드시 즉시 화해로 이어져야 한다고 가르치지 않도록 주의해 주세요. 잘못을 인정하고 사과하는 일은 중요하지만, 용서가 곧바로 신뢰의 회복을 의미하지는 않습니다. 특히 누군가 반복해서 상처를 주거나 위험한 행동을 한다면 부모님이나 믿을 만한 어른에게 도움을 요청해야 합니다.',
   '3번에서는 아이가 실제로 사랑을 보여 줄 한 사람과 한 가지 행동을 정합니다. 부모님은 아이가 거창한 행동을 선택하도록 요구하기보다 일상에서 실천할 수 있는 작은 사랑을 발견하도록 도와주세요.',
   '먼저 인사하기, 외로운 친구에게 말 걸기, 동생의 이야기를 끝까지 듣기, 잘못한 일을 인정하고 사과하기 등 구체적이고 실천 가능한 행동이면 충분합니다.',
   '중요한 것은 아이가 사랑을 실천해야만 하나님의 사랑을 받을 수 있다고 생각하지 않는 것입니다. 우리는 하나님의 사랑을 얻기 위해 사랑하는 것이 아니라, 이미 그리스도 안에서 받은 사랑에 응답하여 사랑합니다.'],
  insight:['성경의 적용은 본문에서 발견한 의미와 분리되어서는 안 됩니다. 빌레몬서의 중심은 단순히 다른 사람에게 친절하게 대하라는 도덕적 가르침이 아닙니다. 그리스도 안에서 새로워진 정체성이 사람을 바라보는 시선과 실제 관계를 변화시킨다는 복음의 선언입니다. 그러므로 금요일의 실천도 예수님의 사랑에서 출발해야 합니다.']}
};
var PG32_EN={
 week:{chip:'This Week at a Glance',title:'A Beloved Brother',sub:'Philemon — The Gospel Makes Us New and Transforms Our Relationships',period:'Oct 26 – Nov 1, 2026 · Devotional Guide for Parents',ref:'Philemon 1:10–18',desc:"This week's main message and theme",
  refs:[['Passage','Philemon 1:10–18'],['Further reading','Philemon 1'],['Memory verse','Philemon 1:16a']],
  parts:[
   ['The Gospel Makes Us New and Transforms Our Relationships',[
    'Philemon is a short and personal letter written by the Apostle Paul to a fellow believer named Philemon. Although the letter addresses a particular situation between individuals, it contains a profound theological message about how the gospel of Jesus Christ transforms both our identity and our relationships with others.',
    'Philemon was a Christian whose home served as a gathering place for the church (Philemon 1:2). Onesimus was an enslaved man belonging to Philemon who had become separated from him and eventually encountered Paul. Scripture suggests the possibility that Onesimus had wronged Philemon or owed him something (v. 18), but it does not explain exactly what happened.',
    'Through his encounter with Paul, Onesimus came to faith in Christ. Paul grew to love him deeply, referring to him as his son and even his very heart. Paul then sent Onesimus back to Philemon with an extraordinary request: Receive Onesimus no longer merely as a slave, but as a beloved brother in Christ.',
    'In Roman society, the relationship between an enslaved person and an owner was defined by a significant difference in social status, freedom, and legal rights. Yet Paul introduced a new way of understanding their relationship, one shaped by the gospel.',
    'Onesimus was still the same person, but because of his new identity in Christ, the way Philemon viewed and treated him needed to change.',
    'This is the central message of our devotional this week:',
    '<b>The gospel of Jesus Christ gives us a new identity and transforms the way we see and treat others.</b>']],
   ['Understanding Philemon Within the Bigger Story of the Bible',[
    "This week, we want to help our children recognize that the story of Philemon is part of God's greater story of redemption.",
    "God created every human being in His image (Genesis 1:27). However, sin brought brokenness not only into humanity's relationship with God but also into relationships between people.",
    "Through Jesus Christ, God reconciled us to Himself and brought peace through the cross. In Christ, people from different backgrounds are brought together as members of God's family (Ephesians 2:14–16).",
    'The letter to Philemon offers a practical glimpse of what this gospel-centered reconciliation can look like.',
    'Paul asked Philemon to receive Onesimus as a beloved brother. He even offered to take responsibility for anything Onesimus owed. These actions remind us that reconciliation is not simply an idea or a feeling. The gospel calls us to express love through meaningful actions and renewed relationships.',
    "However, we should not interpret Paul's willingness to assume Onesimus's debt as being identical to Christ's redemptive work on the cross. Rather, Paul's actions can be understood as a human expression of love that reflects the sacrificial love of Christ."]]],
  threeTitle:'Three Theological Truths for Parents to Remember',
  three:[
   ['First, forgiveness does not mean pretending that wrongdoing never happened.','Paul loved Onesimus, but he did not simply ignore the possibility that Onesimus had wronged Philemon or owed him something. Instead, Paul offered to take responsibility for the debt. Love and responsibility are not opposites. Help your child understand that forgiveness does not require denying wrongdoing, ignoring pain, or pretending that harmful actions do not matter.'],
   ['Second, the gospel changes how we recognize the value of others.',"Paul did not define Onesimus only by his past or his social position. He emphasized Onesimus's new relationship with Philemon as a beloved brother in Christ. This teaches us that a person's worth should not be determined by appearance, abilities, circumstances, social position, or past mistakes."],
   ['Third, genuine love grows from a willing heart and becomes visible through action.',"Paul could have commanded Philemon, but he chose to appeal to him through love (vv. 8–9). He wanted Philemon's good deed to come willingly rather than through compulsion (v. 14). Christian love is more than doing the right thing because someone tells us to. It is a response that grows from understanding the love we have already received in Christ."]],
  threeAfter:['Throughout this week, rather than immediately providing answers, encourage your child to observe what the Bible actually says. Help them distinguish between what Scripture clearly records and what we may imagine or infer.',
   'Learning to observe Scripture carefully, understand its meaning in context, and connect a particular passage to the larger message of the gospel is an essential part of growing in biblical understanding.'],
  verse:['Philemon 1:16a','No longer as a bondservant but more than a bondservant, as a beloved brother.'],
  closing:{title:"Closing This Week's Devotional",body:[
    'Throughout this week, children have explored a short letter written by Paul to Philemon and discovered how the gospel can change the way we view and treat others.',
    'Onesimus had been enslaved by Philemon, yet Paul asked that he be received as a beloved brother in Christ. The gospel Paul preached was not simply a collection of religious teachings or new information. It was the good news of Jesus Christ, bringing new life, a new identity, and a new way of relating to others.',
    "Paul's letter reminds us that God's love is not meant to remain an abstract idea. It is meant to shape our attitudes, our decisions, and our relationships.",
    "As you conclude this week's devotional, consider discussing this question with your child:"],
   ask:'“When I remember how much Jesus loves me, how might that change the way I see and treat other people?”',
   after:['Give your child time to think and respond in their own words. Even a simple answer can reveal that your child is beginning to connect the truth of the gospel with everyday life.',
    "This is one of the most meaningful goals of devotional learning: not merely knowing what the Bible says, but gradually learning to understand God's Word and live in response to it."],
   keyTitle:"This Week's Key Message",
   key:'Jesus loves us and makes us new. Because we have received His love, we are called to value and love others as He has loved us.',
   end:"May this small but meaningful letter help our children discover a little more of God's great story of redemption and grow in their ability to recognize His love throughout Scripture and in their everyday lives."}},
 mon:{day:'Monday',name:'Open Hearts',sub:'Feel the Story!',title:"Paul's Special Letter",
  focus:'Entering the world of the Bible through imagination and historical understanding',
  body:['On Monday, children will imagine Paul writing his letter and consider the situation Onesimus may have faced. Before connecting the biblical story to their own experiences, help children become familiar with the historical world in which the events took place.',
   "In Roman society, an enslaved person was not simply an employee or household helper. Enslaved people lived with serious restrictions on their freedom and legal rights and did not enjoy the same social standing as their owners. A simple explanation of this background can help children begin to understand why Paul's request to receive Onesimus as a beloved brother was so significant.",
   'In Question 1, encourage your child to imagine Paul writing his letter while imprisoned. Although Paul was not free, he continued caring for others and writing on their behalf.',
   "Questions 2 and 3 invite children to imagine Onesimus's feelings and what he might have wanted to say when returning to Philemon. However, Scripture does not tell us exactly how Onesimus felt or what he said. Your child might imagine that Onesimus felt afraid, worried, or hopeful. Rather than choosing one emotion as the correct answer, encourage your child to recognize the difference between what Scripture records and what we imagine.",
   'Question 4 asks children to consider what Paul hoped would happen when Philemon received the letter. Remember that the Bible does not tell us how Philemon ultimately responded.'],
  insight:['Understanding Scripture begins with recognizing that the biblical world was different from our own. We should not immediately impose modern assumptions on an ancient text. Instead, we first seek to understand its historical and cultural setting.',
   'When children imagine the circumstances surrounding Paul and Onesimus, they are taking an early step toward interpreting Scripture within its original context.']},
 tue:{day:'Tuesday',name:'Find the Word',sub:'Explore the Word!',title:'What Did Paul Ask Philemon to Do?',
  focus:'Discovering what Scripture actually says',
  body:['On Tuesday, children will carefully examine the passage to discover how Paul describes Onesimus and what he asks Philemon to do.',
   'In Question 1, Paul refers to Onesimus as his "son." This does not mean Onesimus was Paul\'s biological child. Rather, it expresses their spiritual relationship, since Onesimus came to faith while Paul was imprisoned. Help your child recognize the affection and spiritual connection behind Paul\'s words.',
   'Question 2 focuses on Paul\'s description of Onesimus as formerly "useless" but now "useful." The name Onesimus is associated with the idea of being useful or beneficial. Paul appears to use this wordplay to emphasize the change that has taken place in Onesimus\'s life.',
   'However, we must be careful not to suggest that Onesimus became valuable only because he became useful to Paul. A person\'s worth is not determined by how helpful or productive that person is. Instead, Paul is describing the transformation associated with Onesimus\'s new life in Christ.',
   'Question 3 introduces the central verse of the week. Paul asks Philemon to receive Onesimus as a beloved brother. This request goes beyond simply treating someone kindly. It recognizes a new relationship established through their shared identity in Christ.',
   'Question 4 examines Paul\'s willingness to take responsibility for anything Onesimus may have owed. Draw attention to the conditional language of verse 18: "If he has wronged you at all, or owes you anything." The Bible does not specify exactly what Onesimus did or how much he may have owed.'],
  insight:['Faithful biblical interpretation requires distinguishing between what Scripture explicitly states and what we assume or infer.',
   'Helping children search the passage for answers is more than a Bible knowledge exercise. It teaches them to base their understanding on Scripture rather than on personal assumptions. This habit provides an important foundation for lifelong Bible study.']},
 wed:{day:'Wednesday',name:'Hidden Story',sub:'Discover the Heart!',title:"The Heart Behind Paul's Request",
  focus:"Discovering the intentions behind Paul's words and actions",
  body:['On Wednesday, children move beyond identifying what Paul said to considering why he said it.',
   "Question 1 focuses on Paul's choice to appeal to Philemon through love rather than command (vv. 8–9). As an apostle, Paul believed he had the authority to instruct Philemon. Nevertheless, he chose to make a personal appeal grounded in love.",
   "Question 3 connects closely with this idea. Paul wanted Philemon's good deed to come willingly, not through compulsion (v. 14). This reveals an important principle of Christian ethics: the outward appearance of a good action is not the only thing that matters. The attitude and motivation behind an action are also important.",
   'In Question 2, Paul describes Onesimus as his "very heart." The Greek expression uses a word associated with deep inward feelings and affection. It communicates how precious Onesimus had become to Paul. Onesimus was not simply someone who could help Paul with practical tasks. He was someone Paul deeply loved.',
   "Question 4 highlights Paul's request that Philemon welcome Onesimus as he would welcome Paul himself (v. 17). Paul was willing to use his own relationship with Philemon to advocate for Onesimus and encourage reconciliation.",
   "As you discuss these questions, help your child think about how love can shape the way we speak and respond to others. However, Wednesday is primarily about understanding Paul's intentions. There is no need to rush immediately into personal application. Allow your child time to discover the meaning behind Paul's words."],
  insight:["Paul's appeal demonstrates the relationship between love, authority, and willing obedience. Rather than relying only on his authority to secure Philemon's compliance, Paul encouraged a response motivated by love.",
   "This principle also has implications for Christian parenting. Our goal is not merely to produce outwardly correct behavior. We want our children to gradually understand why certain actions reflect God's character and to develop the ability to make thoughtful, willing choices rooted in faith."]},
 thu:{day:'Thursday',name:"God's Heart",sub:"Getting to Know God's Heart!",title:'Relationships Made New in Jesus Christ',
  focus:"Connecting Philemon's story to the larger message of the gospel",
  body:['Thursday invites children to connect the events in Philemon with the broader biblical story of salvation and reconciliation.',
   'Question 1 focuses on Philemon 1:16, where Paul asks Philemon to receive Onesimus not merely as a slave, but as <b>a beloved brother</b> in Christ.',
   "In Roman society, enslaved people and their owners had very different social positions and legal rights. However, Paul emphasizes that Onesimus's new identity in Christ should change the way Philemon sees and treats him.",
   "This reveals an important truth: the gospel does not simply transform a person's inner life. It also transforms the way we relate to others.",
   "Help your child understand that being a “beloved brother” means more than simply being friendly. It means recognizing and welcoming one another as valued members of God's family through Jesus Christ.",
   "Question 2 introduces Galatians 3:28, which teaches that believers from different backgrounds are one in Christ Jesus. In the ancient world, distinctions of ethnicity, social status, and gender strongly influenced how people viewed and treated one another. Yet Paul teaches that these differences do not prevent believers from belonging together to Christ. The gospel does not mean that every human difference disappears. Rather, those differences should not become barriers to recognizing one another as valued members of God's family.",
   "Question 3 compares Paul's willingness to take responsibility for Onesimus's debt with Jesus' sacrifice for our sins. Paul offered to assume the cost of what Onesimus might owe. Jesus Christ gave Himself for our sins through His death on the cross.",
   "Although Paul's action is not equivalent to Christ's saving work, it helps us recognize how sacrificial love can be expressed in human relationships. The gospel invites us not only to receive God's love but also to reflect that love in the way we treat others.",
   'Question 4 asks children how Philemon and Onesimus should treat one another as believers in Jesus. Children may respond with ideas such as love, respect, forgiveness, or welcoming one another as brothers. Help them understand the reason behind these responses: both men now belonged to Christ.'],
  insight:["Philemon demonstrates that the gospel does not remain only within a person's private spiritual life. It has implications for the relationships and social structures in which people live.",
   "Within a society shaped by the distinction between enslaved people and owners, Paul called Philemon to recognize Onesimus as a beloved brother in Christ. This request challenges the assumption that social position should determine a person's worth or the love and respect that person receives.",
   'As you guide your child, avoid reducing this passage to a simple moral instruction such as "Be nice to others." The foundation of Christian love is the gospel: We love because Christ first loved us. Our actions are meant to flow from this truth.']},
 fri:{day:'Friday',name:'Into My Life',sub:'How Should I Live?',title:'Living Out the Love of Jesus',
  focus:'Applying the gospel to everyday relationships',
  body:['On Friday, children bring what they have learned throughout the week into their relationships with others.',
   'Question 1 presents a situation in which a child continues to be labeled as bad because of a past mistake. The purpose is not to teach that wrongdoing should be ignored or excused. Rather, it is to help children recognize that a person\'s identity and value should not be reduced to something they have done wrong. This connects with Paul\'s request that Philemon receive Onesimus as a beloved brother rather than viewing him only through his former position or past circumstances.',
   'Question 2 encourages children to identify words that can help restore a relationship after an argument. Expressions such as "I\'m sorry," "I\'ll listen to you," and "I want us to be friends again" represent important aspects of reconciliation: admitting wrongdoing, listening with understanding, and expressing a desire for peace.',
   'At the same time, be careful not to teach children that every conflict must result in immediate reconciliation. Acknowledging wrongdoing and offering forgiveness are important, but forgiveness does not automatically restore trust. If someone repeatedly hurts a child or behaves in an unsafe way, the child should know that seeking help from a parent or trusted adult is appropriate and necessary.',
   'Question 3 invites children to choose one person to whom they can show love and one specific action they can take. Encourage your child to think of simple and realistic ways to practice love. They might greet someone who often feels left out, invite a classmate to play, listen patiently to a sibling, or acknowledge a mistake and offer a sincere apology.',
   'The goal is not to accomplish something impressive. Instead, help your child understand that even small actions can become meaningful expressions of the love they have received from Jesus.',
   "Most importantly, children should never feel that they must perform loving actions in order to earn God's love. We do not love others to make God love us. We love because God has already loved us in Christ."],
  insight:['Faithful application of Scripture must grow out of the meaning of the passage itself. The central message of Philemon is not simply that Christians should be kind. It is that our new identity in Christ changes how we understand and relate to other people.',
   "Therefore, Friday's activities should not become merely a checklist of good behavior. Instead, they should provide opportunities for children to respond to the gospel through thoughtful and loving actions."]}

var VERSES33=[[1, "믿음은 바라는 것들의 실상이요 보이지 않는 것들의 증거니", "Now faith is the assurance of things hoped for, the conviction of things not seen."], [2, "선진들이 이로써 증거를 얻었느니라", "For by it the people of old received their commendation."], [3, "믿음으로 모든 세계가 하나님의 말씀으로 지어진 줄을 우리가 아나니 보이는 것은 나타난 것으로 말미암아 된 것이 아니니라", "By faith we understand that the universe was created by the word of God, so that what is seen was not made out of things that are visible."], [4, "믿음으로 아벨은 가인보다 더 나은 제사를 하나님께 드림으로 의로운 자라 하시는 증거를 얻었으니 하나님이 그 예물에 대하여 증언하심이라 그가 죽었으나 그 믿음으로써 지금도 말하느니라", "By faith Abel offered to God a more acceptable sacrifice than Cain, through which he was commended as righteous, God commending him by accepting his gifts. And through his faith, though he died, he still speaks."], [5, "믿음으로 에녹은 죽음을 보지 않고 옮겨졌으니 하나님이 그를 옮기심으로 다시 보이지 아니하였느니라 그는 옮겨지기 전에 하나님을 기쁘시게 하는 자라 하는 증거를 받았느니라", "By faith Enoch was taken up so that he should not see death, and he was not found, because God had taken him. Now before he was taken he was commended as having pleased God."], [6, "믿음이 없이는 하나님을 기쁘시게 하지 못하나니 하나님께 나아가는 자는 반드시 그가 계신 것과 또한 그가 자기를 찾는 자들에게 상 주시는 이심을 믿어야 할지니라", "And without faith it is impossible to please him, for whoever would draw near to God must believe that he exists and that he rewards those who seek him.", 1]];

var PG33={"week": {"chip": "이번 주 말씀 한눈에 보기", "title": "믿음으로 살아가요!", "sub": "히브리서 — 보이지 않는 하나님을 신뢰하는 믿음", "period": "2026.11.2–11.8 · 부모님을 위한 묵상 가이드", "ref": "히브리서 11:1-6", "color": "#FBEBB8", "ink": "#6E5410", "desc": "한 주의 핵심 메시지와 주제", "refs": [["본문", "히브리서 11:1–6"], ["참고 말씀", "히브리서 11장, 12:1–2"], ["암송 말씀", "히브리서 11:6"]], "parts": [["보이지 않는 하나님을 신뢰하는 믿음", ["히브리서는 신앙 때문에 어려움을 겪고 있던 성도들에게 믿음을 굳게 지키도록 권면하는 말씀입니다. 그들은 예수님을 믿는다는 이유로 여러 어려움을 경험했고, 신앙을 포기하고 싶은 유혹과도 마주해야 했습니다.", "이러한 성도들에게 히브리서 기자는 믿음으로 살아갔던 구약의 사람들을 소개합니다. 그들은 모두 서로 다른 시대와 환경 속에서 살았지만, 눈에 보이는 상황보다 하나님과 그분의 약속을 신뢰하며 살아갔습니다.", "히브리서 11장 1절은 믿음을 '바라는 것들의 실상이요 보이지 않는 것들의 증거'라고 설명합니다. 여기에서 믿음은 단순히 눈에 보이지 않는 것을 사실이라고 생각하거나, 간절히 바라는 일이 반드시 이루어질 것이라고 확신하는 것이 아닙니다. 아직 눈앞에 결과가 나타나지 않았더라도 하나님이 신실하신 분임을 믿고 의지하는 것입니다.", "이번 주 본문은 아벨과 에녹이라는 두 사람을 소개합니다.", "아벨은 믿음으로 하나님께 더 나은 제사를 드렸고, 에녹은 하나님과 동행하며 하나님을 기쁘시게 한 사람으로 인정받았습니다. 두 사람의 삶은 서로 달랐지만, 그들이 하나님께 나아가는 중심에는 믿음이 있었습니다.", "히브리서 11장 6절은 믿음이 없이는 하나님을 기쁘시게 할 수 없다고 말씀합니다. 하나님께 나아가는 사람은 하나님이 계신 것과 자신을 찾는 사람들에게 상 주시는 분임을 믿어야 합니다.", "여기에서 '상'은 우리가 하나님께 기도하거나 순종하면 원하는 것을 반드시 얻게 된다는 의미가 아닙니다. 하나님은 자신을 찾는 사람들을 외면하지 않으시며, 자신의 약속에 신실하신 분이라는 사실을 보여 줍니다.", "히브리서 11장의 마지막은 믿음의 사람들조차 하나님의 약속이 완전히 이루어지는 것을 모두 보지는 못했다고 말씀합니다(11:39–40). 그리고 12장 2절에서는 우리의 시선을 예수님께로 향하게 합니다.", "예수님은 단순히 믿음의 좋은 본보기가 아니라 우리 믿음의 근원이시며 그 믿음을 온전하게 하시는 분입니다.", "이번 주 아이들이 배워야 할 믿음도 여기에 있습니다. 하나님을 믿는다고 해서 어려움이 없어지거나 원하는 일이 모두 이루어지는 것은 아닙니다. 그러나 어려움 가운데서도 예수님을 바라보고, 하나님께 도움을 구하며, 말씀을 따라 살아갈 수 있습니다."]]], "threeTitle": "이번 주 묵상의 세 가지 목표", "three": ["하나님은 눈에 보이지 않지만 살아 계시며 신뢰할 수 있는 분임을 알아갑니다.", "아벨과 에녹의 삶을 통해 믿음이 예배와 하나님과의 동행으로 나타난다는 사실을 배웁니다.", "어려움과 기다림 속에서도 우리의 믿음을 온전하게 하시는 예수님을 바라보며 살아가는 방법을 익힙니다."], "verse": ["히브리서 11:6", "믿음이 없이는 하나님을 기쁘시게 하지 못하나니 하나님께 나아가는 자는 반드시 그가 계신 것과 또한 그가 자기를 찾는 자들에게 상 주시는 이심을 믿어야 할지니라"], "closing": {"title": "이번 주 부모님께 전하고 싶은 마지막 메시지", "body": ["이번 히브리서 묵상에서 가장 강조하고 싶은 것은 아이들이 믿음을 잘해야 하는 또 하나의 숙제로 여기지 않도록 하는 것입니다.", "아벨과 에녹의 삶을 배웠다고 해서 아이들에게 언제나 믿음이 좋아야 하고, 두려워하지 않아야 하며, 하나님을 실망시키지 않아야 한다는 부담을 주어서는 안 됩니다.", "히브리서는 믿음의 사람들을 소개한 후 우리의 시선을 예수님께로 돌립니다.", "아이들이 이번 주를 마칠 때 다음과 같은 고백을 할 수 있다면 좋겠습니다."], "ask": "“하나님, 저는 아직 하나님을 잘 모르는 것도 있고, 걱정되는 일도 있어요. 그래도 예수님을 바라보며 하나님을 믿고 살아가고 싶어요.”", "after": ["그렇게 믿음은 완벽한 사람에게 요구되는 조건이 아니라, 연약한 우리를 붙드시는 예수님을 신뢰하며 자라 가는 삶이라는 사실을 배워 가게 될 것입니다."]}}, "mon": {"day": "월요일", "name": "마음 열기", "sub": "말씀을 느껴요!", "title": "보이지 않는 것을 생각하며 믿음에 마음을 열어요.", "color": "#F6D6D1", "ink": "#7A3A35", "focus": "월요일에는 아이들이 바람을 관찰하는 것에서 출발합니다.", "body": ["바람 자체는 눈으로 볼 수 없지만, 흔들리는 나뭇잎이나 날아가는 연을 통해 바람이 불고 있다는 사실을 알 수 있습니다. 이어서 사랑과 소리처럼 눈에 보이지 않아도 존재를 알 수 있는 것들을 생각해 봅니다.", "이 활동의 목적은 자연현상을 통해 하나님의 존재를 증명하는 것이 아닙니다. 아이들이 <b>'눈에 보이지 않는다고 해서 존재하지 않는 것은 아니다'</b>라는 개념을 친숙한 경험으로 이해하도록 돕는 것입니다.", "이후 하나님을 언제 생각하는지 돌아보고, 하나님께 하고 싶은 말을 적도록 안내합니다.", "부모님께서는 아이가 하나님에 대해 어떤 생각을 가지고 있는지 먼저 들어 주세요. 아이가 기도하거나 찬양할 때 하나님을 생각한다고 답할 수도 있지만, 잘 모르겠다고 말할 수도 있습니다.", "믿음에 관한 질문에 반드시 긍정적인 답을 해야 한다는 부담을 주지 않는 것이 중요합니다. 오히려 자신의 생각과 궁금증을 솔직하게 표현하도록 격려해 주세요."], "tip": "\"우리는 하나님을 눈으로 볼 수 없지만, 성경을 통해 하나님이 어떤 분이신지 알아갈 수 있어. 하나님에 대해 궁금한 것이 있니?\""}, "tue": {"day": "화요일", "name": "말씀 찾기", "sub": "말씀에 있는 그대로 찾아요", "title": "성경이 말씀하는 믿음의 의미와 믿음의 사람들을 발견해요.", "color": "#E1DBF8", "ink": "#4F4290", "focus": "화요일에는 히브리서 11장 1–6절을 직접 읽고 믿음에 관해 성경이 무엇이라고 말씀하는지 찾아봅니다.", "body": ["첫 번째 질문에서는 '실상'과 '증거'라는 단어를 발견합니다. 이 단어들은 초등학교 저학년 아이들에게 어렵게 느껴질 수 있습니다.", "부모님께서는 '실상'을 하나님이 약속하신 것을 확신하는 마음으로, '증거'를 아직 눈으로 보지 못하더라도 하나님의 말씀을 신뢰하는 것으로 쉽게 설명해 주시면 좋겠습니다.", "3절에서는 하나님이 말씀으로 세상을 창조하셨다는 사실을 발견하고, 4–5절에서는 아벨과 에녹이라는 두 믿음의 사람을 만납니다.", "아벨은 믿음으로 제사를 드렸고 에녹은 하나님을 기쁘시게 했습니다. 여기에서 아이들이 발견해야 할 것은 단순히 두 사람의 이름과 행동을 연결하는 것이 아닙니다. 하나님을 기쁘시게 하는 삶에는 하나님을 향한 믿음이 있다는 사실입니다.", "특히 믿음이 어떤 특별한 능력이나 대단한 일을 이루는 힘이라고 이해하지 않도록 주의해 주세요."], "tip": "\"아벨과 에녹은 서로 다른 일을 했지만 둘 다 하나님을 믿었어. 하나님께서는 그들의 믿음을 기쁘게 보셨단다.\""}, "wed": {"day": "수요일", "name": "숨은 이야기", "sub": "숨은 마음을 발견해요!", "title": "아벨과 에녹의 행동에 담긴 믿음의 의미를 발견해요.", "color": "#DCE7C6", "ink": "#44572A", "focus": "수요일에는 본문에 기록된 행동을 한 걸음 더 깊이 살펴봅니다.", "body": ["아벨은 제사를 드렸습니다. 그러나 성경은 단순히 제사를 드렸다는 사실만을 강조하지 않고 '믿음으로' 더 나은 제사를 드렸다고 말씀합니다.", "창세기 4장의 이야기에서도 하나님은 아벨과 그의 제물을 받으셨다고 기록합니다. 따라서 부모님께서는 제물의 종류나 외적인 모습만으로 두 사람의 차이를 설명하기보다, 히브리서가 강조하는 하나님을 향한 믿음에 주목하도록 도와주세요.", "에녹에 관해서는 창세기 5장 22–24절이 하나님과 동행한 사람이라고 설명합니다. 하나님과 동행한다는 것은 하나님과 실제로 나란히 걸어 다녔다는 뜻이 아니라, 하나님과 지속적인 관계를 맺으며 그분을 의지하는 삶을 가리킵니다.", "아이들은 기도하거나 하나님의 말씀을 따르는 행동을 통해 그 의미를 이해할 수 있습니다.", "마지막 질문에서는 히브리서 기자가 왜 두 사람의 믿음을 소개했는지 생각합니다. 당시 어려움을 겪던 성도들에게 믿음으로 살아가는 모습을 보여 주고, 그들도 하나님을 계속 신뢰하도록 격려하기 위해서입니다."], "tip": "\"아벨은 하나님께 예배드렸고 에녹은 하나님과 동행했어. 하나님을 믿는 모습은 서로 달라도 괜찮아. 우리도 매일의 생활에서 하나님을 믿고 따를 수 있단다.\""}, "thu": {"day": "목요일", "name": "하나님 마음", "sub": "하나님의 마음을 알아가요!", "title": "믿음을 기뻐하시는 하나님과 믿음을 온전하게 하시는 예수님을 알아가요.", "color": "#FBE3D2", "ink": "#8A4A22", "focus": "목요일은 이번 주 묵상에서 가장 중요한 신학적 연결이 이루어지는 날입니다.", "body": ["먼저 히브리서 11장 6절을 통해 하나님이 계신 것과 자신을 찾는 사람들에게 상 주시는 분임을 배웁니다.", "'상을 주시는 하나님'이라는 표현을 설명할 때에는 특별한 주의가 필요합니다. 아이들은 하나님을 믿고 기도하면 좋은 성적을 받거나 원하는 선물을 얻게 된다고 이해할 수 있습니다.", "그러나 하나님을 믿는 것은 원하는 결과를 얻기 위한 방법이 아닙니다. 하나님이 자신을 찾는 사람들을 외면하지 않으시며 약속에 신실하신 분이라는 사실을 신뢰하는 것입니다.", "이후 히브리서 12장 2절을 통해 우리의 시선이 예수님께로 향하게 됩니다.", "아벨과 에녹은 믿음으로 하나님을 기쁘시게 한 사람들이지만, 예수님은 우리의 믿음을 시작하시고 온전하게 하시는 분입니다.", "아이들이 예수님을 바라본다는 말을 실제로 예수님의 모습을 눈으로 찾는 일로 이해하지 않도록 도와주세요. 예수님을 바라본다는 것은 예수님이 누구신지 기억하고, 그분의 말씀을 신뢰하며, 그분께 도움을 구하고 의지하는 것을 의미합니다."], "tip": "\"하나님은 우리가 하나님을 믿고 찾아오는 것을 기뻐하셔. 그리고 예수님은 우리의 믿음을 도와주시고 온전하게 하시는 분이야. 그러니까 믿음이 약해질 때에도 예수님께 나아갈 수 있어.\""}, "fri": {"day": "금요일", "name": "내 삶으로", "sub": "나는 어떻게 살아야 할까요?", "title": "어려움과 기다림 속에서도 예수님을 바라보며 믿음으로 살아가요.", "color": "#D6ECF5", "ink": "#2F5A72", "focus": "금요일에는 한 주 동안 배운 믿음의 의미를 아이들의 실제 생활에 적용합니다.", "body": ["시험이 걱정되거나, 기도한 일이 아직 이루어지지 않았거나, 친구에게 먼저 다가갈 용기가 나지 않는 상황을 생각합니다.", "이러한 질문의 목적은 아이들에게 무조건 긍정적으로 생각하거나 두려움을 없애라고 가르치는 것이 아닙니다.", "믿음은 걱정이 없는 상태가 아니라 걱정되는 상황에서도 하나님께 나아가고 그분을 의지하는 것임을 배우도록 돕는 것입니다.", "예를 들어 시험이 걱정될 때에는 기도하며 최선을 다해 준비할 수 있습니다. 기도한 일이 아직 이루어지지 않았다면 하나님께 자신의 마음을 계속 말씀드리며 기다릴 수 있습니다. 친구와 화해하는 일이 두렵다면 예수님께 도움을 구하고 용기를 내어 먼저 다가갈 수 있습니다.", "두 번째 질문에서는 예수님을 바라보는 구체적인 행동을 선택합니다. 기도하고, 예수님의 말씀을 따르며, 도움을 구하고, 예수님이 함께하심을 믿는 일은 믿음이 일상에서 나타나는 실제적인 모습입니다.", "마지막 질문에서는 자신의 걱정이나 기다림을 직접 기도로 표현합니다.", "부모님께서는 아이가 적은 걱정을 가볍게 여기지 말고 함께 들어 주세요. 아이가 기다리는 일이 이루어질 것이라고 쉽게 약속하기보다는, 결과를 알 수 없는 상황에서도 하나님께 마음을 맡길 수 있도록 격려하는 것이 중요합니다."], "tip": "\"하나님을 믿는다고 해서 모든 일이 우리 마음대로 되는 것은 아니야. 하지만 어떤 일이 생겨도 우리는 하나님께 기도할 수 있어. 예수님을 바라보며 함께 믿음으로 걸어가 보자.\""}};
var PG33_EN={"week": {"chip": "This Week at a Glance", "title": "Live by Faith!", "sub": "Hebrews — Trusting the God We Cannot See", "period": "Nov 2 – Nov 8, 2026 · Devotional Guide for Parents", "ref": "Hebrews 11:1–6", "desc": "This week’s main message and theme", "refs": [["Passage", "Hebrews 11:1–6"], ["Further reading", "Hebrews 11; 12:1–2"], ["Memory verse", "Hebrews 11:6"]], "parts": [["Trusting the God We Cannot See", ["The book of Hebrews encourages believers who were facing difficulties because of their faith to remain steadfast in trusting God. They experienced hardship and faced the temptation to turn away from what they believed.", "To encourage them, the writer of Hebrews introduces people from the Old Testament who lived by faith. Although they lived in different times and circumstances, they shared something important: they trusted God and His promises even when they could not see how everything would turn out.", "Hebrews 11:1 describes faith as the assurance of things hoped for and the conviction of things not seen.", "Faith does not simply mean believing that something invisible exists. Nor does it mean being certain that everything we wish for will happen. Faith means trusting that God is faithful, even when we cannot yet see the outcome.", "This week's passage introduces two people of faith: Abel and Enoch.", "Abel offered a better sacrifice to God by faith, and Enoch was commended as someone who pleased God. Although their lives were different, both demonstrated faith in God.", "Hebrews 11:6 teaches that without faith it is impossible to please God. Those who come to Him must believe that He exists and that He rewards those who seek Him.", "The promise that God rewards those who seek Him should not be understood as a guarantee that He will give us everything we ask for. Rather, it reminds us that God is faithful and does not disregard those who seek Him.", "Toward the end of Hebrews 11, we learn that even the great examples of faith did not receive the complete fulfillment of everything God had promised during their lifetimes (Hebrews 11:39–40). The writer then directs our attention to Jesus in Hebrews 12:2.", "Jesus is not simply another example of faith. He is the founder and perfecter of our faith.", "Through this week's devotional, children will discover that trusting God does not mean life will always be easy. Even when they are worried, afraid, or waiting for an answer, they can look to Jesus and continue trusting God."]]], "threeTitle": "Three Goals for This Week", "three": ["Discover that God exists, even though we cannot see Him, and that He is worthy of our trust.", "Learn through Abel and Enoch that faith is expressed through worship and walking with God.", "Practice looking to Jesus, the founder and perfecter of our faith, in everyday situations."], "verse": ["Hebrews 11:6", "And without faith it is impossible to please him, for whoever would draw near to God must believe that he exists and that he rewards those who seek him."], "closing": {"title": "A Final Message for Parents This Week", "body": ["The most important thing we hope for in this study of Hebrews is that children do not treat faith as one more assignment to do well.", "Having learned about Abel and Enoch, children should not feel pressure to always have strong faith, never be afraid, or never disappoint God.", "After introducing the people of faith, Hebrews turns our eyes to Jesus.", "We hope that at the end of this week your child can say something like this:"], "ask": "“God, there are still things I don’t know about You, and there are things I am worried about. Even so, I want to look to Jesus and live trusting You.”", "after": ["Faith is not about being perfect. It is about learning to trust Jesus, who holds us and brings our faith to completion."]}}, "mon": {"day": "Monday", "name": "Open Hearts", "sub": "Feel the Story!", "title": "Exploring what we cannot see and opening our hearts to faith.", "focus": "Monday begins with a familiar experience: the wind.", "body": ["Although children cannot see the wind itself, they can recognize its presence through moving leaves or a flying kite. They then consider other things, such as love and sound, that cannot be seen but whose presence can still be recognized.", "The purpose of this activity is not to prove God's existence through natural examples. Rather, it helps children understand that something does not have to be visible to be real.", "Children then think about when they remember God and what they would like to say to Him.", "Encourage your child to express their thoughts freely. Some children may confidently describe their faith, while others may have questions or uncertainties.", "Avoid pressuring children to give what they think is the correct answer. Their honest thoughts can become a meaningful starting point for conversations about God."], "tip": "\"We cannot see God with our eyes, but we can learn about Him through the Bible. Is there anything you wonder about God?\""}, "tue": {"day": "Tuesday", "name": "Find the Word", "sub": "Explore the Word.", "title": "Discovering what the Bible teaches about faith.", "focus": "On Tuesday, children read Hebrews 11:1–6 and identify what Scripture teaches about faith.", "body": ["The words assurance and conviction may be difficult for younger children. Explain assurance as confidence in what God has promised and conviction as trusting God's Word even when we cannot see everything He is doing.", "Verse 3 teaches that God created the universe by His word. Verses 4–5 introduce Abel and Enoch as examples of faith.", "Abel offered a sacrifice by faith, and Enoch was commended for pleasing God.", "Help your child notice that the central lesson is not simply what these people accomplished, but their trust in God.", "Faith is not a special power that enables us to achieve extraordinary things. It is trusting the God who is faithful."], "tip": "\"Abel and Enoch did different things, but they both trusted God. God was pleased with their faith.\""}, "wed": {"day": "Wednesday", "name": "Hidden Story", "sub": "Discover the Heart!", "title": "Discovering the faith behind Abel's and Enoch's actions.", "focus": "Wednesday helps children move beyond identifying what Abel and Enoch did to considering the faith behind their actions.", "body": ["Hebrews emphasizes that Abel offered a better sacrifice by faith. Genesis 4 also describes how God regarded Abel and his offering.", "Rather than focusing only on the type or appearance of the sacrifice, guide your child to notice the importance Hebrews places on Abel's faith.", "Genesis 5:22–24 tells us that Enoch walked with God. This does not mean that he was simply walking physically beside God. It describes a life of ongoing fellowship with and trust in God.", "Children can begin to understand this through familiar practices such as prayer, listening to God's Word, and choosing to follow Him.", "The final question invites children to consider why the writer of Hebrews included these examples. The writer wanted to encourage believers facing difficulties to continue trusting God."], "tip": "\"Abel worshiped God, and Enoch walked with God. Their lives were different, but both trusted Him. We can also trust and follow God in our everyday lives.\""}, "thu": {"day": "Thursday", "name": "God's Heart", "sub": "Getting to Know God's Heart!", "title": "Knowing the God who is pleased by faith and Jesus who perfects our faith.", "focus": "Thursday brings together two important truths from Hebrews 11:6 and 12:2.", "body": ["First, children learn that those who come to God must believe He exists and that He rewards those who seek Him.", "Be careful when explaining God's reward. Children may assume that praying or obeying God guarantees good grades, special gifts, or the answers they want.", "Help them understand that faith is not a way to obtain everything we desire. God is faithful, and He does not disregard those who seek Him.", "Next, children discover Jesus as the founder and perfecter of our faith.", "Abel and Enoch are examples of people who trusted God, but Jesus is more than an example. He is the One through whom our faith begins and is brought to completion.", "Explain that looking to Jesus does not mean trying to see Him with our physical eyes. It means remembering who He is, trusting His Word, seeking His help, and depending on Him."], "tip": "\"God is pleased when we trust and seek Him. Jesus is the One who helps us grow in faith. Even when our faith feels weak, we can come to Him.\""}, "fri": {"day": "Friday", "name": "Into My Life", "sub": "How Should I Live?", "title": "Looking to Jesus and practicing faith in everyday life.", "focus": "Friday invites children to apply what they have learned to real situations.", "body": ["They consider what to do when they are worried about a test, when a prayer has not yet been answered, or when they are afraid to approach a friend after an argument.", "The goal is not to teach children that faith means having no fear or always thinking positively.", "Faith does not mean the absence of worry. It means learning to trust God even when we are worried.", "A child who is anxious about a test can pray and prepare responsibly. A child waiting for an answer to prayer can continue bringing that hope to God. A child who is afraid to make peace with a friend can ask Jesus for help and take a courageous step.", "The second question invites children to identify practical ways to look to Jesus: praying honestly, following His Word, asking for help, and remembering His presence.", "The final activity encourages children to express their own worries or hopes through prayer.", "Listen carefully to what your child shares. Avoid making promises that a particular outcome will happen. Instead, reassure them that they can bring their concerns to God and continue trusting Him."], "tip": "\"Trusting God does not mean everything will happen exactly the way we want. But whatever happens, we can pray, seek His help, and keep looking to Jesus.\""}};

function speakFrom(i,tok){

 try{var vs=window.speechSynthesis.getVoices().filter(function(x){return x.lang&&x.lang.replace('_','-').indexOf(u.lang.slice(0,2))===0;});if(vs[0])u.voice=vs[0];}catch(e){}
 u.onboundary=vBound('.verse.now .vt',(en?'Verse '+v[0]+'. ':v[0]+'절. ').length,tok);

}
