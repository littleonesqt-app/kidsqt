.note textarea{width:100%;box-sizing:border-box;height:52px;resize:none;padding:5px 12px;line-height:1.4!important;border-radius:14px;border:0;background:rgba(255,255,255,.72);color:var(--ink);font:16px/1.5 var(--body)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));row-gap:10px;justify-items:center}
.cal-h{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;font-size:12px;font-weight:500;color:var(--muted)}
.cday{display:flex;flex-direction:column;align-items:center;gap:4px;padding:0;border:0;background:transparent}
.cday .c{position:relative;width:44px;height:44px;border-radius:22px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;background:#DDD5C9}
.cday .c.future{background:#ECE6DD}
.cday .c.today{background:#FFFFFF;border:2.5px dashed #E0A82E}
.cday .c.sun{background:var(--lav)}
.cday .c.sat{background:var(--peach)}
.cday .c.done{background:transparent}
.cday .n{font-size:13px;font-weight:500;color:#5E514A}
.cday .n.today{padding:1px 8px;border-radius:10px;background:#6F9A47;color:#FFFFFF;font-weight:700}
.cbadge{position:absolute;right:-3px;bottom:-2px;width:18px;height:18px;border-radius:9px;background:var(--sageD);border:2px solid var(--bg);display:flex;align-items:center;justify-content:center}
.smile-new{position:relative;animation:smilein .9s cubic-bezier(.3,1.4,.5,1) .35s both}
.giftwrap{display:flex;filter:drop-shadow(0 4px 6px rgba(155,138,227,.45))}
.cday .c.done .giftwrap{margin-top:-4px}
.giftpill{display:inline-block;padding:2px 8px;border-radius:10px;background:#F8C548;color:#3A2620;font-size:10px;font-weight:700;white-space:nowrap;box-shadow:0 2px 0 #E0A82E}
.gotgift{position:absolute;left:-4px;bottom:-2px;width:20px;height:20px;border-radius:10px;background:#FFFFFF;display:flex;align-items:center;justify-content:center}
.giftbanner{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border:3px solid #F8C548;border-radius:24px;background:#FFF6D9;text-align:left;animation:pop .5s ease-out}
.calhills{position:fixed;left:0;right:0;bottom:0;height:calc(210px + env(safe-area-inset-bottom,0px));z-index:0;pointer-events:none;overflow:hidden}
.calpage{position:relative;z-index:1;word-break:keep-all}
.calcard{padding:14px 12px 16px;border-radius:28px;background:#FFFFFF;box-shadow:0 6px 16px rgba(74,44,37,.07)}
.calcard .cal-h{margin-bottom:8px}
.smile-new::before{content:'';position:absolute;inset:-6px;border-radius:50%;border:3px solid #F8C548;animation:ringout 1.4s ease-out .9s 2 both;pointer-events:none}
@keyframes ringout{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.6);opacity:0}}
.track{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));justify-items:center;row-gap:4px}
.tc{width:40px;height:40px;border-radius:20px;box-sizing:border-box;display:flex;align-items:center;justify-content:center;background:#DDD5C9}
.bar{height:10px;border-radius:5px;background:#ECE6DD;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sageD);border-radius:5px;transition:width .3s}
.tee{position:relative;width:56px;height:56px;border-radius:18px;background:#FFFFFF;display:flex;align-items:center;justify-content:center}
.lock{position:absolute;right:-4px;top:-4px;width:22px;height:22px;border-radius:11px;background:#7A5C4E;display:flex;align-items:center;justify-content:center}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px 10px;border-radius:20px;border:3px solid #FFFFFF;background:#FFFFFF;font-size:12px;font-weight:700}
.tile.sel{border-color:var(--brown);background:var(--butter)}
.tile.locked{border-color:#ECE6DD;background:#ECE6DD}
.tile.locked svg{opacity:.35}
.tile.locked .lock svg{opacity:1}
.wearing{position:absolute;left:8px;top:8px;padding:2px 8px;border-radius:10px;background:var(--sageD);color:#FFFFFF;font-size:10px;font-weight:700}
.overlay{position:fixed;inset:0;z-index:40;background:rgba(58,38,32,.52);display:flex;align-items:center;justify-content:center;padding:0 max(22px,env(safe-area-inset-left,0px));overflow:hidden}
.overlay .fx{position:absolute;inset:0;pointer-events:none}
.dialog{position:relative;width:100%;max-width:420px;padding:24px 22px 16px;border-radius:32px;background:#FFFFFF;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;animation:pop .5s ease-out}
.daypick{display:flex;gap:6px;align-items:center;margin-top:2px;flex-wrap:wrap;justify-content:center}
.daypick button{width:34px;height:34px;border-radius:17px;border:0;background:var(--bg);font-size:12px;font-weight:700;color:var(--muted)}
.daypick button.on{background:var(--brown);color:#FFFFFF}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:50;padding:10px 18px;border-radius:20px;background:var(--brown);color:#FFFFFF;font-size:14px;font-weight:700;white-space:nowrap;animation:toastin .35s ease-out}
@keyframes toastin{0%{opacity:0;transform:translate(-50%,-8px)}100%{opacity:1;transform:translate(-50%,0)}}
@keyframes pop{0%{transform:scale(.7);opacity:0}60%{transform:scale(1.04);opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes rise{0%{transform:translateY(0)}100%{transform:translateY(-110vh)}}
@keyframes burst{0%{transform:scale(.1);opacity:0}25%{opacity:1}70%{transform:scale(1);opacity:1}100%{transform:scale(1.15);opacity:0}}
@keyframes twinkle{0%,100%{opacity:.3;transform:scale(.75)}50%{opacity:1;transform:scale(1.15)}}
@keyframes shoot{0%{transform:translate(0,0);opacity:0}15%{opacity:1}100%{transform:translate(-320px,200px);opacity:0}}
@keyframes bloom{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.12) rotate(6deg)}100%{transform:scale(1) rotate(0)}}
@keyframes sway{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
@keyframes fall{0%{transform:translateY(-60px) rotate(0)}100%{transform:translateY(110vh) rotate(340deg)}}
@keyframes draw{0%{stroke-dashoffset:170}100%{stroke-dashoffset:0}}
@keyframes wiggle{0%,100%{transform:rotate(0) scale(1)}20%{transform:rotate(-10deg) scale(1.06)}40%{transform:rotate(9deg) scale(1.06)}60%{transform:rotate(-5deg)}80%{transform:rotate(3deg)}}
@keyframes smilein{0%{transform:scale(0) rotate(-90deg);opacity:0}60%{transform:scale(1.25) rotate(10deg);opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
/* thank-you flowers: a pot beside each weekday note; sprout until the note is done, then it blooms */
.note label.npot{gap:1px}
.fpwrap{display:flex;height:103px}
@media (max-width:374px){.ntab svg{display:none}}
.fpot{display:block;overflow:visible}
.ntoday{padding:0 7px;border-radius:9px;background:#F8C548;color:#3A2620}
.ntxt{position:relative}
.ntxt.can textarea{padding-right:86px}
.ndone{position:absolute;right:6px;bottom:6px;height:32px;padding:0 11px;border:0;border-radius:16px;background:var(--brown);color:#FFFFFF;font-size:12px;font-weight:700;display:flex;align-items:center;gap:4px;animation:pop .3s ease-out}
.ndone[hidden]{display:none}
.fpot.grow .fp-sprout{opacity:0;animation:fpout .5s ease-in both}
.fpot.grow .fp-stem{transform-origin:50px 58px;animation:fpstem .8s cubic-bezier(.3,1.2,.5,1) .3s both}
.fpot.grow .fp-leaf{animation:fpleaf .6s cubic-bezier(.3,1.4,.5,1) .8s both}
.fpot.grow .fp-l{transform-origin:50px 51px}
.fpot.grow .fp-r{transform-origin:50px 44px;animation-delay:.95s}
.fpot.grow .fp-head{transform-origin:50px 30px;animation:fpbud .5s ease-out 1.1s both}
.fpot.grow .fp-pet{transform-box:fill-box;transform-origin:center;animation:fppet .55s cubic-bezier(.3,1.5,.5,1) both;animation-delay:calc(1.45s + var(--d,0s))}
.fpot.grow .fp-spark path{transform-box:fill-box;transform-origin:center;opacity:0;animation:fpspark 1.4s ease-out 1.9s both}
.fpot.grow .fp-spark path:nth-child(2){animation-delay:2.1s}
.fpot.grow .fp-spark path:nth-child(3){animation-delay:2.3s}
@keyframes fpout{0%{opacity:1}100%{opacity:0}}
@keyframes fpstem{0%{transform:scaleY(.15)}100%{transform:scaleY(1)}}
@keyframes fpleaf{0%{transform:scale(0) rotate(-25deg)}100%{transform:scale(1) rotate(0)}}
@keyframes fpbud{0%{transform:scale(0)}100%{transform:scale(1)}}
@keyframes fppet{0%{transform:scale(.2)}100%{transform:scale(1)}}
@keyframes fpspark{0%{opacity:0;transform:scale(.4)}35%{opacity:1;transform:scale(1.15)}100%{opacity:0;transform:scale(1)}}
.fpfx{position:fixed;inset:0;z-index:45;pointer-events:none;overflow:hidden}
@media (prefers-reduced-motion:reduce){.fpfx{display:none}}
/* ===================== Bible storybook ===================== */
.app.bookwide{max-width:1000px}
.bk-wrap{--bkw:440px;--bkh:clamp(420px,calc(100vh - 320px),640px);display:flex;flex-direction:column;align-items:center;gap:14px}
.bk-wrap.spread{--bkw:940px;--bkh:clamp(480px,calc(100vh - 330px),700px)}
.bk-wrap>*{width:100%;max-width:var(--bkw)}
.bk-tools{display:flex;align-items:center;gap:8px}
.bk-tools .seg{flex:1;min-width:0}
.bk-tools .seg button{padding:0 2px;white-space:nowrap;font-size:12.5px}
.bk-ib{width:44px;height:44px;flex-shrink:0;border:0;border-radius:22px;background:#FFFFFF;display:flex;align-items:center;justify-content:center;color:#3A2620}
.bk-ib.on{background:#6F9A47;color:#FFFFFF}
.bk-ib.dark{background:var(--brown);color:#FFFFFF}
.bk-ib.mute{color:#A89C93}
/* closed book: a soft lavender hardcover, like the app's pastel cards */
.bk-closed{position:relative;display:block;max-width:380px;padding:0;border:0;background:transparent;text-align:left;border-radius:22px 38px 38px 22px;box-shadow:5px 5px 0 -1px #FFFFFF,10px 10px 0 -2px #E3EFF9,0 14px 26px rgba(79,111,150,.2);animation:bkin .5s ease-out both;cursor:pointer}
.bk-wrap.spread .bk-closed{max-width:440px}
@keyframes bkin{0%{opacity:0;transform:translateY(10px) scale(.98)}100%{opacity:1;transform:none}}
.bk-cover{position:relative;height:var(--bkh);box-sizing:border-box;display:flex;flex-direction:column;gap:10px;padding:16px 16px 58px 34px;border-radius:22px 38px 38px 22px;background-color:#CFE6F7;background-image:linear-gradient(90deg,rgba(255,255,255,.4) 50%,transparent 50%),linear-gradient(rgba(255,255,255,.4) 50%,transparent 50%);background-size:24px 24px;color:#3A2620;overflow:hidden;word-break:keep-all}
.bk-cover::before{content:'';position:absolute;left:0;top:0;bottom:0;width:18px;background:#A9CDEB}
.bk-cover::after{content:'';position:absolute;left:23px;top:14px;bottom:14px;border-left:2px dashed #FFFFFF}
.bk-ribbon{position:absolute;top:0;right:30px;width:16px;height:52px;background:#F2A79E;clip-path:polygon(0 0,100% 0,100% 100%,50% 80%,0 100%);z-index:2}
.bk-csp{position:absolute;pointer-events:none}
.bk-art{position:relative;display:block;flex:0 0 auto;aspect-ratio:1/1;border-radius:30px;overflow:hidden;background:#EFE0CB;box-shadow:0 0 0 5px #FFFFFF,0 6px 14px rgba(79,66,144,.18)}
.bk-art svg{display:block;width:100%;height:100%}
.bk-cart{display:block;flex:1 1 auto;min-height:0}
.bk-cart svg{display:block;width:100%;height:100%;max-height:260px;margin:0 auto}
.bk-ctext{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;padding:14px 14px 12px;border-radius:22px;background:#FFFFFF;box-shadow:inset 0 0 0 3px #FFFFFF,inset 0 0 0 5px #F6C9D2,0 4px 10px rgba(79,111,150,.12)}
.bk-closed .bk-cover{height:auto}
.bk-cchip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:12px;background:#E3EFF9;color:#3F6E9A;font-size:12px;font-weight:700}
.bk-ctitle{display:block;font-family:var(--display);font-size:24px;line-height:1.25;text-wrap:balance}
.bk-cref{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:#C2567A}
.bk-cbtns{display:flex;flex-direction:column;align-items:center;gap:4px;max-width:380px!important}
/* open book: the same lavender cover around soft cream pages */
.bk-book{position:relative;box-sizing:border-box;padding:12px 12px 14px 18px;border-radius:22px 38px 38px 22px;background-color:#CFE6F7;background-image:linear-gradient(90deg,rgba(255,255,255,.4) 50%,transparent 50%),linear-gradient(rgba(255,255,255,.4) 50%,transparent 50%);background-size:24px 24px;box-shadow:0 14px 26px rgba(79,111,150,.2)}
.bk-book::before{content:'';position:absolute;left:0;top:0;bottom:0;width:12px;border-radius:22px 0 0 22px;background:#A9CDEB}
.bk-book::after{content:'';position:absolute;top:0;right:40px;width:15px;height:58px;background:#F2A79E;clip-path:polygon(0 0,100% 0,100% 100%,50% 80%,0 100%);z-index:6}
.bk-wrap.spread .bk-book{padding:14px 16px 18px;border-radius:38px}
.bk-wrap.spread .bk-book::before{display:none}
.bk-stage{position:relative;perspective:1800px;overflow:hidden;padding:0 7px 7px 0;touch-action:pan-y;-webkit-user-select:none;user-select:none}
.bk-wrap.spread .bk-stage{overflow:visible;padding:0 0 7px}
.bk-pages{position:relative;display:grid;grid-template-columns:minmax(0,1fr)}
.bk-wrap.spread .bk-pages{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.bk-page{position:relative;height:var(--bkh);box-sizing:border-box;display:flex;flex-direction:column;padding:26px 20px 56px 26px;background:#FFFDF8 radial-gradient(#ECE4D6 1.3px,transparent 1.5px) 0 0/20px 20px;overflow:hidden;border-radius:10px 32px 32px 10px;box-shadow:inset 16px 0 16px -14px rgba(79,111,150,.22),3px 3px 0 -1px #FFFFFF,6px 6px 0 -2px #E3EFF9;word-break:keep-all}
.bk-page.l{padding:26px 26px 56px 20px;border-radius:32px 10px 10px 32px;box-shadow:inset -16px 0 16px -14px rgba(79,111,150,.22),-3px 3px 0 -1px #FFFFFF,-6px 6px 0 -2px #E3EFF9}
.bk-tape{position:absolute;left:-14px;top:12px;width:70px;height:20px;transform:rotate(-38deg);background-color:rgba(246,184,196,.85);background-image:linear-gradient(90deg,rgba(255,255,255,.45) 50%,transparent 50%),linear-gradient(rgba(255,255,255,.45) 50%,transparent 50%);background-size:10px 10px;z-index:1}
.bk-page.hide{visibility:hidden}
.bk-page.blank{background:#FBF8F3}
.bk-page.endp{background-color:#CFE6F7;background-image:linear-gradient(90deg,rgba(255,255,255,.4) 50%,transparent 50%),linear-gradient(rgba(255,255,255,.4) 50%,transparent 50%);background-size:24px 24px}
.bk-sprig{position:absolute;right:16px;bottom:10px}
#bkarea{overflow-anchor:none}
.bk-ph{display:flex;align-items:center;gap:10px}
.bk-ref{font-size:14px;font-weight:700;color:#3F6E9A}
.bk-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:14px 2px 6px}
.bk-vt{margin:0;font-size:22px;line-height:1.8;color:#3A2620}
.bk-vsub{margin:14px 0 0;padding:10px 12px;border-radius:14px;background:#F7F4EF;font-size:16px;line-height:1.7;color:#6B5850}
.bk-book.big .bk-vt{font-size:27px}
.bk-book.big .bk-vsub{font-size:19px}
.bk-wrap.spread .bk-vt{font-size:24px}
.bk-wrap.spread .bk-book.big .bk-vt{font-size:29px}
.bk-folio{align-self:center;min-width:28px;height:22px;padding:0 8px;box-sizing:border-box;border-radius:11px;background:#F3F0EA;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:13px;color:#75685F}
.bk-orn{align-items:center;justify-content:center;text-align:center;gap:10px}
.bk-bignum{width:100px;height:100px;border-radius:50px;background:#E3EFF9;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:46px;color:#3F6E9A;margin-top:auto}
.bk-artmini{width:100%;margin-bottom:6px;aspect-ratio:300/220;box-shadow:none;background-color:#CFE6F7;background-image:linear-gradient(90deg,rgba(255,255,255,.4) 50%,transparent 50%),linear-gradient(rgba(255,255,255,.4) 50%,transparent 50%);background-size:24px 24px}
.bk-end{align-items:center;justify-content:center;text-align:center;gap:8px}
.bk-endstars{position:absolute;inset:0;pointer-events:none}
.bk-endstars svg:nth-child(1){position:absolute;left:18%;top:16%}
.bk-endstars svg:nth-child(2){position:absolute;right:20%;top:12%}
.bk-endstars svg:nth-child(3){position:absolute;right:14%;top:30%}
.bk-endflower{display:flex;animation:bloom .9s cubic-bezier(.3,1.4,.5,1) both}
.bk-nav{display:flex;align-items:center;gap:12px;padding:0 6px}
/* side arrows: round, white, half over the book's edge at mid height */
.bk-arrow{width:50px;height:50px;flex-shrink:0;border:0;border-radius:25px;background:#FFFFFF;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px rgba(255,255,255,.55),0 6px 14px rgba(79,111,150,.25);transition:transform .15s,opacity .2s}
.bk-arrow.side{position:absolute;top:50%;z-index:8;margin-top:-25px}
.bk-arrow.side.prev{left:-14px}
.bk-arrow.side.next{right:-14px}
.bk-arrow.side.next svg path{stroke:#4A2C25}
.bk-arrow:active:not(:disabled){transform:scale(.92)}
.bk-arrow:disabled{opacity:.4;cursor:default;box-shadow:0 2px 6px rgba(79,111,150,.12)}
@media (max-width:374px){.bk-arrow.side{width:46px;height:46px;margin-top:-23px}.bk-arrow.side.prev{left:-12px}.bk-arrow.side.next{right:-12px}}
/* swipe hint */
.bk-hint{position:absolute;left:50%;bottom:20px;z-index:9;transform:translateX(-50%);width:calc(100% - 92px);max-width:360px;box-sizing:border-box;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:20px;background:rgba(255,255,255,.96);box-shadow:0 8px 20px rgba(79,111,150,.25);font-size:13px;font-weight:700;line-height:1.4;color:#3A2620;word-break:keep-all;animation:bkhintin .4s ease-out both;transition:opacity .3s}
.bk-hint.out{opacity:0}
.bk-hand{display:flex;flex-shrink:0;animation:bkhand 1.6s ease-in-out infinite}
@keyframes bkhintin{0%{opacity:0;transform:translate(-50%,8px)}100%{opacity:1;transform:translate(-50%,0)}}
@keyframes bkhand{0%,100%{transform:translateX(-5px) rotate(-8deg)}50%{transform:translateX(5px) rotate(8deg)}}
.bk-prog{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;align-items:center}
.bk-pnum{font-size:13px;font-weight:700;color:#5E514A}
.bk-prog .bar{width:100%}
.bk-leaf{position:absolute;z-index:5;transform-style:preserve-3d;transform-origin:0 50%;will-change:transform;animation-duration:var(--bkd,.7s);animation-timing-function:cubic-bezier(.45,.05,.25,1);animation-fill-mode:both}
.bk-leaf.fwd{animation-name:bkfwd}
.bk-leaf.back{animation-name:bkback}
@keyframes bkfwd{0%{transform:rotateY(0)}100%{transform:rotateY(-180deg)}}
@keyframes bkback{0%{transform:rotateY(-180deg)}100%{transform:rotateY(0)}}
.bk-face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden}
.bk-face.b{transform:rotateY(180deg)}
.bk-face>.bk-page,.bk-face>.bk-cover{height:100%}
.bk-face::after{content:'';position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:linear-gradient(90deg,rgba(79,111,150,0) 35%,rgba(79,111,150,.16));animation:bkshade var(--bkd,.7s) ease-in-out both}
.bk-face.b::after{background:linear-gradient(270deg,rgba(79,111,150,0) 35%,rgba(79,111,150,.16))}
@keyframes bkshade{0%{opacity:0}50%{opacity:1}100%{opacity:0}}
@media (max-width:374px){.bk-vt{font-size:20px}.bk-ctitle{font-size:22px}.bk-hdoodle{display:none}}
.bk-bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bk-bg span{position:absolute;display:flex;opacity:.75}
@media (max-width:520px){.bk-hdoodle svg{width:70px;height:auto}}
.bk-garden{position:absolute;left:0;right:0;bottom:0;width:100%;height:52px;pointer-events:none}
.bk-hdoodle{margin-left:auto;flex-shrink:0;align-self:center;display:flex;animation:float 3.4s ease-in-out infinite}
.bk-numwrap{position:relative;width:132px;height:132px;display:flex;align-items:center;justify-content:center;margin-top:auto}
.bk-numwrap svg{position:absolute;inset:0;width:100%;height:100%}
.bk-numwrap .bk-bignum{margin-top:0}
@media (max-width:374px){.bk-hdoodle{display:none}}
/* sticker collection: two kinds (thank-you notes, memory verse), one collection */
.stkkinds2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stkkind2{display:flex;align-items:center;gap:8px;padding:10px;border-radius:20px;background:#FFFFFF;word-break:keep-all}
.stkkind2 .stkcount{margin-left:auto}
.stktabs{display:flex;gap:6px;padding:4px;border-radius:22px;background:#F3F0EA}
.stktab{flex:1;min-width:0;height:38px;border:0;border-radius:19px;background:transparent;font-size:13px;font-weight:700;color:#75685F;display:flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap}
